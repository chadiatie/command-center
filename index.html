<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b101b">
  <link rel="icon" href="/aurora-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
  <title>Aurora</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f8fc;
      --muted: rgba(235, 239, 249, .72);
      --glass: rgba(9, 14, 24, .66);
      --glass-strong: rgba(8, 12, 21, .82);
      --line: rgba(255, 255, 255, .17);
      --violet: #8b78ff;
      --violet-soft: #b7adff;
      --shadow: 0 18px 55px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar { display: none; }

    body {
      overflow: hidden;
      background: #0a101a;
      color: var(--ink);
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }

    button,
    input { font: inherit; }

    a { color: inherit; text-decoration: none; }

    .material-symbols-rounded {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      line-height: 1;
    }

    .home {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 680px;
      overflow: hidden;
      isolation: isolate;
    }

    .background-photo {
      position: absolute;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 44%;
      filter: saturate(.94) contrast(1.02);
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(4, 8, 15, .7) 0%, rgba(5, 10, 18, .2) 25%, rgba(5, 9, 16, .03) 56%, rgba(5, 9, 16, .74) 100%),
        radial-gradient(circle at 50% 24%, rgba(16, 22, 34, .08) 0%, rgba(5, 9, 16, .18) 55%, rgba(4, 7, 13, .32) 100%);
    }

    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      padding: 0 clamp(24px, 4vw, 64px);
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      background: rgba(5, 9, 16, .35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      box-shadow: 0 8px 24px rgba(115, 92, 255, .3);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: clamp(20px, 3vw, 42px);
    }

    .nav a {
      position: relative;
      padding: 10px 0;
      color: rgba(240, 243, 250, .7);
      font-size: 14px;
      font-weight: 600;
      transition: color .2s ease, background .2s ease;
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: #fff;
      outline: none;
    }

    .nav a[aria-current="page"] {
      color: var(--violet-soft);
    }

    .nav a[aria-current="page"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 2px;
      border-radius: 2px;
      background: var(--violet);
      box-shadow: 0 0 14px rgba(139, 120, 255, .6);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      gap: clamp(24px, 3.2vw, 48px);
    }

    .profile {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(178, 164, 255, .24);
      border-radius: 50%;
      background: rgba(112, 84, 217, .3);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(980px, calc(100% - 48px));
      margin: clamp(56px, 7.2vh, 76px) auto 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 5vw, 66px);
      line-height: 1.05;
      letter-spacing: -.055em;
      text-shadow: 0 4px 30px rgba(0, 0, 0, .46);
    }

    h1 .name { color: var(--violet-soft); }

    .search {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      width: min(880px, 100%);
      height: 66px;
      margin-top: 28px;
      padding: 0 12px 0 21px;
      border: 1px solid rgba(167, 151, 255, .78);
      border-radius: 999px;
      background: rgba(8, 12, 21, .76);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .08), 0 0 0 4px rgba(110, 87, 255, .08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .search > .material-symbols-rounded {
      color: rgba(255, 255, 255, .64);
      font-size: 23px;
    }

    .search input {
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      padding: 0 14px;
      background: transparent;
      color: #fff;
      font-size: 17px;
    }

    .search input::placeholder { color: rgba(231, 235, 244, .55); }

    .search button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 43px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      background: linear-gradient(135deg, #8d79ff, #6755e6);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 9px 24px rgba(81, 60, 203, .32);
    }

    .search button:hover { filter: brightness(1.08); }
    .search button:focus-visible { outline: 3px solid rgba(255, 255, 255, .55); }
    .search button .material-symbols-rounded { font-size: 18px; }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(7, minmax(76px, 1fr));
      gap: clamp(13px, 2.2vw, 28px);
      width: min(860px, 100%);
      margin-top: 31px;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: rgba(249, 250, 253, .9);
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .7);
    }

    .shortcut-icon {
      display: grid;
      place-items: center;
      width: 80px;
      height: 80px;
      border: 1px solid rgba(178, 164, 255, .2);
      border-radius: 50%;
      background: rgba(10, 14, 23, .54);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .shortcut:hover .shortcut-icon,
    .shortcut:focus-visible .shortcut-icon {
      transform: translateY(-4px);
      border-color: rgba(178, 164, 255, .62);
      background: rgba(21, 25, 38, .9);
    }

    .shortcut:focus-visible { outline: none; }

    .shortcut-icon img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .shortcut:first-child .shortcut-icon img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
    }

    .daily-rail {
      position: absolute;
      z-index: 4;
      left: 24px;
      right: 24px;
      bottom: 18px;
      display: grid;
      grid-template-columns: minmax(180px, .8fr) minmax(390px, 1.45fr) minmax(260px, 1fr);
      align-items: center;
      min-height: 64px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 20px;
      background: rgba(7, 11, 19, .74);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .26), inset 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .rail-block {
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 42px;
      padding: 0 22px;
    }

    .rail-block + .rail-block { border-left: 1px solid rgba(255, 255, 255, .1); }

    .weather {
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .weather .material-symbols-rounded {
      color: #ffe0a2;
      font-size: 27px;
      font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    .weather-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .weather-copy small { color: var(--muted); font-weight: 500; }

    .focus {
      gap: 16px;
      justify-content: center;
    }

    .date {
      flex: 0 0 auto;
      color: rgba(244, 247, 252, .72);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .focus-input-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      width: min(290px, 100%);
      height: 36px;
      padding: 0 11px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 11px;
      background: rgba(255, 255, 255, .055);
    }

    .focus-input-wrap .material-symbols-rounded {
      flex: 0 0 auto;
      color: var(--violet-soft);
      font-size: 18px;
    }

    .focus-input-wrap input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 13px;
      font-weight: 500;
    }

    .focus-input-wrap input::placeholder { color: rgba(235, 239, 249, .58); }

    .reading {
      justify-content: flex-end;
      gap: 6px;
    }

    .reading a {
      padding: 8px 10px;
      border-radius: 9px;
      color: rgba(239, 242, 248, .68);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .reading a:hover,
    .reading a:focus-visible {
      color: white;
      background: rgba(255, 255, 255, .08);
      outline: none;
    }

    @media (max-width: 1050px) {
      .stage { margin-top: 54px; }
      .daily-rail { grid-template-columns: .75fr 1.4fr; }
      .reading { display: none; }
    }

    @media (max-width: 760px) {
      body { overflow-y: auto; }

      .home {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
        padding-bottom: 22px;
      }

      .background-photo {
        position: fixed;
        object-position: 50% 56%;
      }

      .atmosphere { position: fixed; }

      .topbar {
        height: 64px;
        padding: 0 16px;
      }

      .brand span { display: none; }

      .nav-wrap { gap: 0; }
      .nav { gap: 15px; }
      .profile { display: none; }

      .nav a {
        padding: 8px 0;
        font-size: 12px;
      }

      .stage {
        width: min(100% - 32px, 560px);
        margin-top: 48px;
      }

      .eyebrow { font-size: 11px; }
      h1 { font-size: clamp(36px, 10vw, 50px); }

      .search {
        grid-template-columns: 25px 1fr 42px;
        height: 58px;
        margin-top: 24px;
        padding: 0 8px 0 17px;
      }

      .search input { padding: 0 9px; font-size: 15px; }

      .search button {
        width: 42px;
        height: 42px;
        padding: 0;
        justify-content: center;
      }

      .search button span:last-child { display: none; }

      .shortcuts {
        grid-template-columns: repeat(4, 1fr);
        gap: 20px 9px;
        margin-top: 28px;
      }

      .shortcut-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
      }

      .shortcut-icon img { width: 34px; height: 34px; }

      .daily-rail {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        grid-template-columns: 1fr;
        width: min(100% - 32px, 560px);
        margin: 34px auto 0;
      }

      .rail-block { padding: 14px 18px; }
      .rail-block + .rail-block { border-left: 0; border-top: 1px solid rgba(255, 255, 255, .1); }
      .focus { flex-direction: column; align-items: flex-start; gap: 10px; }
      .focus-input-wrap { width: 100%; }
      .reading { display: flex; justify-content: flex-start; flex-wrap: wrap; }
    }

    @media (max-height: 760px) and (min-width: 761px) {
      .stage { margin-top: 35px; }
      .shortcuts { margin-top: 24px; }
      .shortcut-icon { width: 70px; height: 70px; border-radius: 50%; }
    }
  </style>
</head>
<body>
  <main class="home">
    <img class="background-photo" src="/assets/rory-beach-home-web.jpg" alt="Rory running on the beach">
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="Aurora home">
        <img src="/aurora-icon.svg" alt="">
        <span>Aurora</span>
      </a>
      <div class="nav-wrap">
        <nav class="nav" aria-label="Aurora navigation">
          <a href="/" aria-current="page">Home</a>
          <a href="/daily.html">Today</a>
          <a href="/tools.html?mode=Tools">Tools</a>
          <a href="/tools.html?mode=Sources">Sources</a>
          <a href="/subscriptions.html">Subscriptions</a>
        </nav>
        <span class="profile" aria-label="Chadi">C</span>
      </div>
    </header>

    <section class="stage" aria-labelledby="greeting">
      <h1 id="greeting"><span id="greetingPrefix">Good evening,</span> <span class="name">Chadi</span></h1>

      <form class="search" action="https://www.google.com/search" method="get" role="search">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input type="search" name="q" autocomplete="off" placeholder="Search Google" aria-label="Search Google">
        <button type="submit"><span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span><span>Search</span></button>
      </form>

      <div class="shortcuts" aria-label="Most visited">
        <a class="shortcut" href="/daily.html"><span class="shortcut-icon"><img src="/aurora-icon.svg" alt=""></span><span>Today</span></a>
        <a class="shortcut" href="https://maps.google.com"><span class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=maps.google.com&sz=128" alt=""></span><span>Maps</span></a>
        <a class="shortcut" href="https://www.youtube.com"><span class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt=""></span><span>YouTube</span></a>
        <a class="shortcut" href="https://onedrive.live.com"><span class="shortcut-icon"><img src="https://w7.pngwing.com/pngs/786/952/png-transparent-microsoft-onedrive-drive-office-365-logo-icon.png" alt=""></span><span>OneDrive</span></a>
        <a class="shortcut" href="https://www.linkedin.com"><span class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=linkedin.com&sz=128" alt=""></span><span>LinkedIn</span></a>
        <a class="shortcut" href="https://www.flashscore.com"><span class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=flashscore.com&sz=128" alt=""></span><span>Flashscore</span></a>
        <a class="shortcut" href="https://lifehacker.com"><span class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=lifehacker.com&sz=128" alt=""></span><span>Lifehacker</span></a>
      </div>
    </section>

    <aside class="daily-rail" aria-label="Daily brief">
      <div class="rail-block weather">
        <span class="material-symbols-rounded" id="weatherIcon" aria-hidden="true">partly_cloudy_day</span>
        <span class="weather-copy"><strong id="weatherText">Lausanne · loading</strong><small id="weatherDetail">Current weather</small></span>
      </div>
      <div class="rail-block focus">
        <span class="date" id="today">Today</span>
        <label class="focus-input-wrap" for="focusInput"><span class="material-symbols-rounded" aria-hidden="true">target</span><input id="focusInput" type="text" maxlength="80" placeholder="Choose today’s focus"></label>
      </div>
      <div class="rail-block reading" aria-label="Daily reading">
        <a href="https://www.reuters.com/business/">Business</a>
        <a href="https://techcrunch.com/">Tech</a>
        <a href="https://www.swissinfo.ch/eng/">Switzerland</a>
      </div>
    </aside>
  </main>

  <script>
    (() => {
      const now = new Date();
      const hour = now.getHours();
      const greeting = hour >= 5 && hour < 12 ? "Good morning," : hour >= 12 && hour < 18 ? "Good afternoon," : "Good evening,";
      document.getElementById("greetingPrefix").textContent = greeting;
      document.getElementById("today").textContent = new Intl.DateTimeFormat("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(now);

      const focusInput = document.getElementById("focusInput");
      const focusKey = "aurora.dailyFocus.v2";
      try { focusInput.value = localStorage.getItem(focusKey) || ""; } catch (_) {}
      focusInput.addEventListener("input", () => {
        try { localStorage.setItem(focusKey, focusInput.value); } catch (_) {}
      });
      focusInput.addEventListener("keydown", event => {
        if (event.key === "Enter") focusInput.blur();
      });

      const weatherIcon = document.getElementById("weatherIcon");
      const weatherText = document.getElementById("weatherText");
      const weatherDetail = document.getElementById("weatherDetail");
      const weatherStates = code => {
        if (code === 0) return ["sunny", "Clear sky"];
        if (code <= 3) return ["partly_cloudy_day", "Partly cloudy"];
        if (code === 45 || code === 48) return ["foggy", "Foggy"];
        if (code >= 51 && code <= 67) return ["rainy", "Rain"];
        if (code >= 71 && code <= 77) return ["weather_snowy", "Snow"];
        if (code >= 80 && code <= 82) return ["rainy", "Rain showers"];
        if (code >= 85 && code <= 86) return ["weather_snowy", "Snow showers"];
        if (code >= 95) return ["thunderstorm", "Thunderstorm"];
        return ["partly_cloudy_day", "Current weather"];
      };

      fetch("https://api.open-meteo.com/v1/forecast?latitude=46.5197&longitude=6.6323&current=temperature_2m,weather_code&timezone=Europe%2FZurich&forecast_days=1")
        .then(response => response.ok ? response.json() : Promise.reject(new Error("Weather unavailable")))
        .then(data => {
          const current = data.current;
          const [icon, condition] = weatherStates(current.weather_code);
          weatherIcon.textContent = icon;
          weatherText.textContent = `Lausanne · ${Math.round(current.temperature_2m)}°`;
          weatherDetail.textContent = condition;
        })
        .catch(() => {
          weatherText.textContent = "Lausanne";
          weatherDetail.textContent = "Weather unavailable";
        });
    })();
  </script>
</body>
</html>
