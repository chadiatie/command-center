<html lang="en" data-theme="dark">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>try{document.documentElement.dataset.theme=localStorage.getItem('auroraTheme')||localStorage.getItem('auroraHomeTheme')||'dark'}catch{}const legacyMode=new URLSearchParams(location.search).get('mode');if(legacyMode==='Tools'||legacyMode==='Sources')location.replace('/apps.html?mode='+legacyMode);</script>
  <link rel="stylesheet" href="/hub.css"><title>Today · Aurora</title>

<body class="hub-page" data-page="today">
  <div class="hub-shell">
    <header class="hub-header" id="hubHeader"></header>
    <section class="page-intro today-intro" aria-labelledby="pageTitle"><div><h1 id="pageTitle">Good afternoon, Chadi.</h1><p class="date-line" id="todayLabel"></p></div><blockquote class="daily-quote"><p id="dailyQuote">Make room for one meaningful thing today.</p><footer>Daily motivation · Aurora</footer></blockquote></section>

  </div>
